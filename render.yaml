# Render blueprint: the five ticketing microservices.
# NATS Streaming and Redis stay on the OCI VM, not defined here.
services:
  - type: web
    name: ticketing-auth
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/FaisalMisbah23/microservices
    branch: main
    rootDir: auth
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NEW_RELIC_LICENSE_KEY
        sync: false
      - key: NEW_RELIC_APP_NAME
        value: ticketing-auth
      - key: NEW_RELIC_LOG
        value: stdout
      - key: NEW_RELIC_LOG_LEVEL
        value: info
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "false"
      - key: JWT_KEY
        sync: false
      - key: MONGO_URI
        sync: false
  - type: web
    name: ticketing-orders
    runtime: node
    plan: free
    region: singapore
